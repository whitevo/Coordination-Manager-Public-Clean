name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Typecheck, Lint, Test, Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Code
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 12.15.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: |
            Code/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Audit high and critical (OSV)
        run: pwsh -NoProfile -File ../scripts/security-check.ps1 -SkipMonorepoTests -SkipGitleaks

      - name: Build web and docs
        run: pnpm --filter @coordination-manager/web --filter @coordination-manager/docs build

      - name: Install Chromium for CSS compatibility checks
        run: pnpm --dir apps/web exec playwright install --with-deps chromium

      - name: Test compiled CSS compatibility
        run: pnpm --dir apps/web exec playwright test e2e/tailwind-compatibility.spec.ts --reporter=line
